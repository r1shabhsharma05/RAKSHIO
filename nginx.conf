# Minimal nginx config for the RAKSHIO static PWA.
# Serves the Vite build on port 3000 with SPA fallback: any unknown path
# falls back to index.html so the HashRouter routes keep working on reload.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
