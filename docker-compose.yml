# RAKSHIO — `docker compose up` serves the app on http://localhost:3000.
# No env vars, no secret keys, no backend: no .env file is needed.
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
